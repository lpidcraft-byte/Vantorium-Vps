<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — BotHub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex}
  .hidden{display:none!important}
  /* Auth */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#1e293b 0%,#0a0e1a 60%);width:100%}
  .auth-box{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:36px;width:100%;max-width:400px}
  .auth-box h1{font-size:22px;margin-bottom:6px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .auth-box p{color:#64748b;font-size:13px;margin-bottom:24px}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:500}
  .form-group input{width:100%;padding:11px 14px;background:#0a0e1a;border:1px solid #1f2937;border-radius:8px;color:#e2e8f0;font-size:14px}
  .form-group input:focus{outline:none;border-color:#3b82f6}
  .btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:8px;color:white;font-size:14px;font-weight:600;cursor:pointer}
  .error-msg{background:#7f1d1d;color:#fecaca;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
  /* Shell */
  .sidebar{width:230px;background:#111827;border-right:1px solid #1f2937;padding:20px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .logo{padding:0 20px 20px;font-size:18px;font-weight:700;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#94a3b8;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
  .nav a:hover{background:#0a0e1a;color:#e2e8f0}
  .nav a.active{background:#0a0e1a;color:#e2e8f0;border-left-color:#3b82f6;font-weight:500}
  .nav a .badge{margin-left:auto;background:#dc2626;color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
  .main{flex:1;padding:28px 32px;overflow-y:auto;max-height:100vh}
  h1{font-size:24px;margin-bottom:6px}
  .sub{color:#64748b;font-size:13px;margin-bottom:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:18px}
  .stat .label{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
  .stat .value{font-size:26px;font-weight:700}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .filters button{background:#111827;border:1px solid #1f2937;color:#94a3b8;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
  .filters button.active{background:#3b82f6;border-color:#3b82f6;color:white}
  .search{width:100%;max-width:400px;padding:10px 14px;background:#111827;border:1px solid #1f2937;color:#e2e8f0;border-radius:8px;margin-bottom:16px;font-size:13px}
  .search:focus{outline:none;border-color:#3b82f6}
  .approval-card{background:#111827;border:1px solid #1f2937;border-radius:14px;margin-bottom:14px;overflow:hidden}
  .card-header{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid #1f2937}
  .avatar{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#1f2937;flex-shrink:0}
  .bot-name{font-size:16px;font-weight:600}
  .bot-user{color:#64748b;font-size:12px}
  .badge-status{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;padding:5px 10px;border-radius:6px;letter-spacing:.5px}
  .st-PENDING_APPROVAL{background:rgba(251,191,36,.15);color:#fbbf24}
  .st-APPROVED{background:rgba(96,165,250,.15);color:#60a5fa}
  .st-DEPLOYING{background:rgba(139,92,246,.15);color:#a78bfa}
  .st-RUNNING{background:rgba(74,222,128,.15);color:#4ade80}
  .st-REJECTED,.st-DEPLOY_FAILED{background:rgba(248,113,113,.15);color:#f87171}
  .card-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.card-body{grid-template-columns:1fr}.sidebar{display:none}}
  .section-title{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .info{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px}
  .info .lbl{color:#64748b}
  .info .val{color:#e2e8f0;word-break:break-all}
  .info .val.mono{font-family:'SF Mono',monospace;font-size:11px}
  .file-box{background:#0a0e1a;border-radius:8px;padding:12px;margin-bottom:8px}
  .file-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{background:#1f2937;color:#e2e8f0;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
  .btn:hover{background:#334155}
  .btn-approve{background:#16a34a;color:white}
  .btn-approve:hover{background:#15803d}
  .btn-reject{background:#dc2626;color:white}
  .btn-reject:hover{background:#b91c1c}
  .actions{padding:14px 20px;display:flex;gap:10px;border-top:1px solid #1f2937;justify-content:flex-end}
  .actions button{padding:10px 22px;font-size:13px;font-weight:600}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
  .modal-bg.active{display:flex}
  .modal{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
  .modal h3{margin-bottom:10px;font-size:18px}
  .modal p{color:#94a3b8;font-size:13px;margin-bottom:16px}
  .modal textarea{width:100%;padding:12px;background:#0a0e1a;border:1px solid #1f2937;color:#e2e8f0;border-radius:8px;margin-bottom:12px;min-height:100px;font-family:inherit;font-size:13px;resize:vertical}
  .modal textarea:focus{outline:none;border-color:#3b82f6}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  pre.viewer{background:#0a0e1a;padding:14px;border-radius:8px;overflow:auto;max-height:400px;font-size:11px;font-family:'SF Mono',monospace;white-space:pre-wrap;word-break:break-all;color:#cbd5e1;border:1px solid #1f2937}
  .toast{position:fixed;bottom:20px;right:20px;background:#111827;border-left:3px solid #16a34a;padding:14px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slideIn .3s}
  .toast.error{border-left-color:#dc2626}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .empty{text-align:center;padding:40px;color:#64748b;font-size:13px}
  .dep-bar{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
  .dep-step{font-size:10px;padding:4px 8px;border-radius:4px;background:#0a0e1a;color:#475569}
  .dep-step.DONE{background:rgba(74,222,128,.15);color:#4ade80}
  .dep-step.RUNNING{background:rgba(96,165,250,.15);color:#60a5fa}
  .topbar-mobile{display:none}
  @media(max-width:900px){.topbar-mobile{display:block;padding:14px 20px;background:#111827;border-bottom:1px solid #1f2937}.main{padding:20px}}
  .logout-btn{position:absolute;bottom:20px;left:20px;right:20px;padding:10px;background:none;border:1px solid #1f2937;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:12px}
  .logout-btn:hover{border-color:#dc2626;color:#f87171}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <h1>Admin Panel</h1>
    <p>ADMIN access only. Regular users get 403.</p>
    <div id="authError" class="error-msg hidden"></div>
    <form onsubmit="adminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="aUser" type="text" value="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="aPass" type="password" value="admin123" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>
</div>

<!-- PANEL -->
<div id="panelScreen" class="hidden" style="display:none; width:100%;">
  <div class="sidebar">
    <div class="logo">Admin</div>
    <div class="nav">
      <a data-tab="overview" onclick="setTab('overview')">📊 Overview</a>
      <a data-tab="approvals" onclick="setTab('approvals')">✅ Bot Approvals <span class="badge hidden" id="pendingBadge">0</span></a>
      <a data-tab="running" onclick="setTab('running')">🤖 Running Bots</a>
      <a data-tab="deployments" onclick="setTab('deployments')">🚀 Deployments</a>
      <a data-tab="audit" onclick="setTab('audit')">📋 Audit Log</a>
    </div>
    <button class="logout-btn" onclick="adminLogout()">Logout</button>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script src="/admin.js"></script>
</body>
</html>
